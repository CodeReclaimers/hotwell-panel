<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOTWELL — UNIT 1 CONTROL BOARD</title>
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body>
  <!-- The whole board is one SVG in a 1600x900 design space; the manifest
       places everything inside it. Scaling is handled by viewBox, so the
       layout degrades gracefully to 1280 without reflowing (§6). -->
  <div id="board-wrap">
    <svg id="board" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Steam plant control board">
      <defs id="face-defs"></defs>
      <rect class="board-field" x="0" y="0" width="1600" height="900"/>
      <g id="layer-annunciator"></g>
      <g id="layer-groups"></g>
      <g id="layer-mimic"></g>
      <g id="layer-elements"></g>
      <g id="layer-right"></g>
    </svg>
  </div>

  <div id="status-bar">
    <span id="conn" class="disconnected">CONNECTING</span>
    <span id="scenario-name">—</span>
    <span id="sim-clock">T + 000:00.0</span>
    <span id="sim-state">—</span>
    <span id="fidelity" title="plant fidelity configuration">—</span>
    <span id="fps" title="frames received per second">—</span>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
