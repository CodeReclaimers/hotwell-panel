<!--
  Mimic one-line: the flow path as a period benchboard draws it, left to right,
  hotwell -> CP-1/2 -> DA -> FP-1/2 -> FRV -> drum -> throttle -> turbine-
  generator -> condenser, with the condensate return running back underneath.

  Hand-authored template (PLAN-panel.md §2). It is confined to the band
  y = 176..240, above the first row of gauges at y = 248; the gauges below are
  the taps on this line. Keep everything inside that band.

  Lines carrying flow declare `data-flow` naming the sensed instrument that
  drives their marching-dash animation (§6.2); pump symbols declare `data-pump`
  so run/trip colour comes from `indications`. Nothing animates by itself —
  the client drives all of it from frames.
-->
<g id="mimic-oneline">
  <!-- ================================================== condensate ======= -->
  <rect class="vessel" x="16" y="184" width="72" height="24" rx="3"/>
  <text class="vessel-label" x="52" y="200">HOTWELL</text>

  <path class="flow-line" data-flow="condensate_flow" d="M88 196 H124"/>
  <!-- CP-1 on the main run, CP-2 on a parallel standby branch (2 x 100%) -->
  <path class="pipe" d="M124 196 V216 H160 V196"/>
  <path class="flow-line" data-flow="condensate_flow" d="M124 196 H160"/>
  <circle class="pump" data-pump="cp1" cx="142" cy="196" r="8"/>
  <circle class="pump" data-pump="cp2" cx="142" cy="216" r="8"/>
  <text class="tag" x="142" y="182">CP 1/2</text>
  <path class="flow-line" data-flow="condensate_flow" d="M160 196 H188"/>
  <!-- DA level control valve: the DA LEVEL loop's actuator (position on that
       station's OUT meter). Sits between CP discharge and the DA inlet,
       exactly where plant.py's condensate path solve puts cv_lcv. -->
  <g class="valve">
    <path d="M188 189 L204 203 L204 189 L188 203 Z"/>
    <text class="tag" x="196" y="182">LCV</text>
  </g>
  <path class="flow-line" data-flow="condensate_flow" d="M204 196 H232"/>

  <!-- ================================================== feedwater / DA === -->
  <rect class="vessel" x="232" y="184" width="64" height="24" rx="3"/>
  <text class="vessel-label" x="264" y="200">DA</text>

  <path class="flow-line" data-flow="feed_flow" d="M296 196 H330"/>
  <path class="pipe" d="M330 196 V216 H366 V196"/>
  <circle class="pump" data-pump="fp1" cx="348" cy="196" r="8"/>
  <circle class="pump" data-pump="fp2" cx="348" cy="216" r="8"/>
  <text class="tag" x="348" y="182">FP 1/2</text>
  <path class="flow-line" data-flow="feed_flow" d="M366 196 H418"/>

  <!-- feed regulating valve -->
  <g class="valve">
    <path d="M418 189 L434 203 L434 189 L418 203 Z"/>
    <text class="tag" x="426" y="182">FRV</text>
  </g>
  <path class="flow-line" data-flow="feed_flow" d="M434 196 H528"/>

  <!-- ====================================================== boiler ======= -->
  <rect class="vessel drum" x="528" y="184" width="104" height="26" rx="13"/>
  <text class="vessel-label" x="580" y="200">DRUM</text>
  <!-- safety valve stack, lifts red when open -->
  <path class="pipe" d="M604 184 V176"/>
  <path class="sv-stack" data-indication="safety_valve_open"
        d="M598 176 H610 L604 168 Z"/>

  <path class="flow-line" data-flow="steam_flow" d="M632 196 H660"/>
  <g class="valve">
    <path d="M660 189 L676 203 L676 189 L660 203 Z"/>
    <text class="tag" x="668" y="182">THR</text>
  </g>

  <!-- ============================================= turbine-electric ====== -->
  <path class="flow-line" data-flow="steam_flow" d="M676 196 H704"/>
  <path class="machine" d="M704 186 L744 180 L744 212 L704 206 Z"/>
  <text class="tag" x="724" y="199">TURB</text>
  <path class="shaft" d="M744 196 H758"/>
  <circle class="machine gen" cx="772" cy="196" r="13"/>
  <text class="tag" x="772" y="199">GEN</text>

  <!-- generator output breaker, driven from indications -->
  <path class="pipe" d="M785 196 H802"/>
  <g class="breaker-sym" data-indication="breaker_closed">
    <rect x="802" y="189" width="14" height="14" rx="2"/>
  </g>
  <path class="pipe" d="M816 196 H836"/>
  <text class="tag" x="846" y="199">BUS</text>

  <!-- exhaust down to the condenser, entering it on centerline (y=222):
       the electrical row (GEN/breaker/BUS) stays above, the condenser sits
       on the exhaust run below it. -->
  <path class="flow-line" data-flow="steam_flow" d="M724 212 V222 H852"/>
  <rect class="vessel" x="852" y="210" width="56" height="24" rx="3"/>
  <text class="vessel-label small" x="880" y="225">COND</text>

  <!-- condensate return, right to left, back to the hotwell -->
  <path class="flow-line return" data-flow="condensate_flow"
        d="M880 234 V240 H52 V208"/>
  <text class="tag return-tag" x="470" y="237">CONDENSATE RETURN</text>
</g>
