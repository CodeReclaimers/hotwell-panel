[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "hotwell-panel"
version = "0.1.0"
description = "1970s-era steam plant control panel for the hotwell simulation core"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alan McIntyre" }]
dependencies = [
    # Pinned to a GitHub tag: hotwell is not on PyPI, and a bare name would
    # resolve against PyPI (and whoever later registers it there).
    "hotwell @ git+https://github.com/CodeReclaimers/hotwell@v0.3.0",
    "fastapi",
    "uvicorn[standard]",
]

[project.urls]
Repository = "https://github.com/CodeReclaimers/hotwell-panel"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    # httpx backs fastapi.testclient.TestClient, which PLAN-panel.md §12.1
    # prescribes for the protocol/WebSocket tests. Test-only.
    "httpx",
    "playwright",   # one optional smoke test (§12.5); skipped when absent
]

[tool.setuptools.packages.find]
where = ["src"]

# The built Svelte client (client/dist) is deliberately NOT packaged: the
# panel is a run-from-checkout tool, and server.py resolves dist relative to
# the checkout.
[tool.setuptools.package-data]
"hotwell_panel" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
